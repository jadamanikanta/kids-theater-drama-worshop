
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5B21B6">
    <title>404 | Page Not Found - StageSprouts</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --primary: #5B21B6;
            --secondary: #F5B82E;
            --bg-color: #FFFFFF;
            --text-color: #171329;
            --card-bg: #FFFFFF;
            --border-color: rgba(91,33,182,.16);
            --primary-light: rgba(91,33,182,.09);
            --secondary-light: rgba(245,184,46,.15);
            --heading-color: #281052;
            --text-light: #625B72;
            --font-heading: "Playfair Display",serif;
            --font-body: "Manrope",sans-serif;
            --primary-dark: #43158A;
            --secondary-dark: #D99A12;
            --transition-fast: all .22s cubic-bezier(.16,1,.3,1);
        }

        body.dark-mode {
            --primary: #A855F7;
            --secondary: #F5B82E;
            --bg-color: #080808;
            --text-color: #FFFFFF;
            --card-bg: #141414;
            --border-color: rgba(245,184,46,.22);
            --primary-light: rgba(168,85,247,.16);
            --secondary-light: rgba(245,184,46,.14);
            --heading-color: #FFFFFF;
            --text-light: #C8C1D5;
            --primary-dark: #9333EA;
            --secondary-dark: #FFD166;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: relative;
            color: var(--text-color);
            background: var(--bg-color);
            font-family: var(--font-body);
            transition: background .3s ease,color .3s ease;
        }

        button, a {
            font: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button:focus-visible, a:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 3px;
        }

        .theater-background {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 12% 18%,var(--primary-light),transparent 36%),
                radial-gradient(ellipse at 88% 82%,var(--secondary-light),transparent 35%),
                var(--bg-color);
        }

        .ambient-glow {
            position: absolute;
            width: 330px;
            height: 330px;
            border-radius: 50%;
            filter: blur(75px);
            opacity: .6;
            animation: glow-drift 12s ease-in-out infinite alternate;
        }

        .glow-one {
            top: -150px;
            left: -100px;
            background: var(--primary-light);
        }

        .glow-two {
            right: -130px;
            bottom: -150px;
            background: var(--secondary-light);
            animation-delay: -4s;
        }

        .stage-light {
            position: absolute;
            top: -20%;
            width: 34%;
            height: 85%;
            opacity: .2;
            filter: blur(24px);
            transform-origin: top center;
            animation: spotlight 8s ease-in-out infinite alternate;
        }

        .stage-light-left {
            left: 8%;
            background: linear-gradient(180deg,var(--primary-light),transparent);
            transform: rotate(22deg);
        }

        .stage-light-right {
            right: 8%;
            background: linear-gradient(180deg,var(--secondary-light),transparent);
            transform: rotate(-22deg);
            animation-delay: -4s;
        }

        .stage-curtain {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 9%;
            opacity: .13;
            background: repeating-linear-gradient(
                90deg,
                var(--primary) 0,
                var(--primary) 12px,
                transparent 12px,
                transparent 27px
            );
            mask-image: linear-gradient(180deg,#000,transparent 92%);
        }

        .curtain-left { left: 0; }
        .curtain-right { right: 0; }

        .theater-orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            border: 1px dashed var(--border-color);
            border-radius: 50%;
            transform: translate(-50%,-50%);
            animation: orbit-pulse 9s ease-in-out infinite;
        }

        .orbit-one {
            width: min(680px,80vw);
            aspect-ratio: 1;
        }

        .orbit-two {
            width: min(500px,65vw);
            aspect-ratio: 1;
            animation-delay: -4s;
        }

        .floating-icon {
            position: absolute;
            display: grid;
            place-items: center;
            width: 65px;
            height: 65px;
            border: 1px solid var(--border-color);
            border-radius: 21px;
            color: var(--primary);
            background: var(--card-bg);
            box-shadow: 0 14px 40px rgba(35,16,70,.07);
            animation: float 6s ease-in-out infinite;
        }

        .floating-icon svg {
            width: 28px;
            height: 28px;
            stroke-width: 1.6;
        }

        .mask-one {
            top: 28%;
            left: 12%;
            transform: rotate(-10deg);
        }

        .mask-two {
            top: 60%;
            left: 15%;
            color: var(--secondary-dark);
            animation-delay: -2s;
        }

        .mask-three {
            right: 12%;
            bottom: 22%;
            color: var(--secondary-dark);
            animation-delay: -3s;
        }

        .floating-star {
            position: absolute;
            width: 20px;
            height: 20px;
            color: var(--secondary);
            animation: star-float 5s ease-in-out infinite;
        }

        .star-one { top: 19%; right: 28%; }
        .star-two { top: 40%; right: 13%; animation-delay: -2s; }
        .star-three { bottom: 19%; left: 28%; animation-delay: -3s; }
        .star-four { top: 70%; right: 28%; animation-delay: -1s; }

        .stage-floor {
            position: absolute;
            right: 0;
            bottom: -100px;
            left: 0;
            height: 200px;
            background: radial-gradient(ellipse,var(--primary-light),transparent 70%);
        }

        .utility-controls {
            position: absolute;
            top: 20px;
            right: 24px;
            z-index: 10;
            display: flex;
            gap: 10px;
        }

        html[dir="rtl"] .utility-controls {
            right: auto;
            left: 24px;
        }

        .header-icon-btn {
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            border: 1px solid var(--border-color);
            border-radius: 13px;
            color: var(--text-color);
            background: var(--card-bg);
            box-shadow: 0 5px 20px rgba(35,16,70,.05);
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .header-icon-btn:hover {
            color: var(--primary);
            border-color: var(--primary);
            background: var(--primary-light);
            transform: translateY(-2px);
        }

        .header-icon-btn svg {
            width: 19px;
            height: 19px;
        }

        .error-page {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 76px 24px 24px;
        }

        .error-card {
            position: relative;
            width: min(100%,530px);
            max-height: 100%;
            padding: 30px 38px 24px;
            overflow: visible;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            background: var(--card-bg);
            box-shadow: 0 25px 80px rgba(35,16,70,.10);
            text-align: center;
            animation: card-enter .7s cubic-bezier(.16,1,.3,1) both;
        }

        .error-card::before {
            position: absolute;
            top: 0;
            right: 22%;
            left: 22%;
            height: 3px;
            border-radius: 0 0 10px 10px;
            background: linear-gradient(90deg,var(--primary),var(--secondary),var(--primary));
            background-size: 200% 100%;
            content: "";
            animation: shimmer 5s linear infinite;
        }

        .meatcraft-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 300px;
            height: 62px;
            max-width: 100%;
            margin: 0 auto 20px;
            text-align: left;
        }

        .logo-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 50px;
            height: 50px;
        }

        .brand-logo-img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .logo-text-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            gap: 4px;
            min-width: 0;
        }

        .logo-brand-title {
            color: var(--primary);
            font-family: var(--font-heading);
            font-size: 25px;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -.7px;
            white-space: nowrap;
        }

        .brand-craft {
            color: var(--secondary);
        }

        .logo-brand-subtitle {
            display: block;
            color: var(--text-light);
            font-family: var(--font-body);
            font-size: 8px;
            font-weight: 800;
            line-height: 1.5;
            letter-spacing: .4px;
            white-space: nowrap;
        }

        .error-illustration {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 0 auto 14px;
            color: var(--primary);
        }

        .error-number {
            font-family: var(--font-heading);
            font-size: clamp(82px,12vw,112px);
            font-weight: 800;
            line-height: .95;
            letter-spacing: -7px;
            text-shadow: 0 8px 25px var(--primary-light);
            animation: number-bounce 4s ease-in-out infinite;
        }

        .error-number:last-of-type {
            animation-delay: -.5s;
        }

        .error-mask {
            display: grid;
            place-items: center;
            width: clamp(72px,9vw,96px);
            height: clamp(72px,9vw,96px);
            border: 2px solid var(--secondary);
            border-radius: 27px;
            color: var(--secondary-dark);
            background: var(--secondary-light);
            transform: rotate(-8deg);
            animation: mask-rock 4s ease-in-out infinite;
        }

        .error-mask svg {
            width: 48px;
            height: 48px;
            stroke-width: 1.5;
        }

        .illustration-star {
            position: absolute;
            color: var(--secondary);
            font-size: 25px;
            animation: star-float 4s ease-in-out infinite;
        }

        .illustration-star-one {
            top: -4px;
            right: 15%;
        }

        .illustration-star-two {
            bottom: 0;
            left: 15%;
            animation-delay: -2s;
        }

        .error-eyebrow {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
            color: var(--primary);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.8px;
            text-transform: uppercase;
        }

        .error-eyebrow svg {
            width: 16px;
            height: 16px;
            color: var(--secondary-dark);
        }

        .error-heading {
            margin-bottom: 10px;
            color: var(--heading-color);
            font-family: var(--font-heading);
            font-size: clamp(29px,4vw,38px);
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -1px;
        }

        .error-description {
            max-width: 365px;
            margin: 0 auto 23px;
            color: var(--text-light);
            font-size: 14px;
            line-height: 1.8;
        }

        .error-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .error-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            min-height: 46px;
            padding: 11px 20px;
            border: 1px solid var(--primary);
            border-radius: 10px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .error-btn svg {
            width: 17px;
            height: 17px;
        }

        .error-btn-primary {
            color: #FFFFFF;
            background: var(--primary);
        }

        .error-btn-primary:hover {
            border-color: var(--secondary);
            color: #171329;
            background: var(--secondary);
            transform: translateY(-2px);
        }

        .error-btn-outline {
            border-color: var(--border-color);
            color: var(--text-color);
            background: transparent;
        }

        .error-btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
            transform: translateY(-2px);
        }

        .error-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 23px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            color: var(--text-light);
            font-size: 11px;
            font-weight: 600;
        }

        .footer-star {
            color: var(--secondary-dark);
            font-size: 13px;
        }

        html[dir="rtl"] .meatcraft-logo {
            direction: rtl;
        }

        html[dir="rtl"] .error-btn svg {
            transform: scaleX(-1);
        }

        @keyframes card-enter {
            from { opacity: 0; transform: translateY(18px) scale(.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes glow-drift {
            from { transform: translate(0,0) scale(1); }
            to { transform: translate(30px,24px) scale(1.15); }
        }

        @keyframes spotlight {
            from { opacity: .12; }
            to { opacity: .32; }
        }

        @keyframes float {
            0%,100% { translate: 0 0; }
            50% { translate: 0 -13px; }
        }

        @keyframes star-float {
            0%,100% { translate: 0 0; rotate: 0deg; opacity: .65; }
            50% { translate: 0 -10px; rotate: 18deg; opacity: 1; }
        }

        @keyframes orbit-pulse {
            0%,100% { opacity: .25; scale: .98; }
            50% { opacity: .7; scale: 1.03; }
        }

        @keyframes number-bounce {
            0%,100% { translate: 0 0; }
            50% { translate: 0 -5px; }
        }

        @keyframes mask-rock {
            0%,100% { rotate: -8deg; translate: 0 0; }
            50% { rotate: 5deg; translate: 0 -5px; }
        }

        @keyframes shimmer {
            to { background-position: 200% 0; }
        }

        @media (max-width: 1024px) {
            .error-card {
                width: min(100%,510px);
                padding: 27px 32px 22px;
            }

            .mask-one { left: 6%; }
            .mask-two { left: 7%; }
            .mask-three { right: 6%; }
        }

        @media (max-width: 768px) {
            .error-page {
                padding: 70px 20px 20px;
            }

            .utility-controls {
                top: 14px;
                right: 16px;
                gap: 8px;
            }

            html[dir="rtl"] .utility-controls {
                right: auto;
                left: 16px;
            }

            .header-icon-btn {
                width: 40px;
                height: 40px;
                border-radius: 11px;
            }

            .error-card {
                width: min(100%,480px);
                padding: 24px 25px 20px;
                border-radius: 21px;
            }

            .meatcraft-logo {
                width: 245px;
                height: 54px;
                gap: 8px;
                margin-bottom: 16px;
            }

            .logo-badge {
                width: 45px;
                height: 45px;
            }

            .logo-brand-title {
                font-size: 22px;
            }

            .logo-brand-subtitle {
                font-size: 7px;
                letter-spacing: .2px;
            }

            .error-number {
                font-size: clamp(76px,15vw,100px);
            }

            .error-mask {
                width: 76px;
                height: 76px;
                border-radius: 22px;
            }

            .error-mask svg {
                width: 39px;
                height: 39px;
            }

            .floating-icon {
                width: 48px;
                height: 48px;
                border-radius: 15px;
                opacity: .7;
            }

            .floating-icon svg {
                width: 23px;
                height: 23px;
            }

            .mask-one { top: 17%; left: 3%; }
            .mask-two { top: 65%; left: 4%; }
            .mask-three { right: 3%; bottom: 17%; }

            .stage-curtain {
                width: 5%;
                opacity: .1;
            }

            .error-description {
                font-size: 13px;
            }
        }

        @media (max-width: 360px) {
            .error-page {
                padding: 60px 12px 12px;
            }

            .utility-controls {
                top: 10px;
                right: 12px;
                gap: 6px;
            }

            html[dir="rtl"] .utility-controls {
                right: auto;
                left: 12px;
            }

            .header-icon-btn {
                width: 35px;
                height: 35px;
                border-radius: 10px;
            }

            .error-card {
                padding: 19px 15px 16px;
                border-radius: 18px;
            }

            .meatcraft-logo {
                width: 215px;
                height: 46px;
                gap: 7px;
                margin-bottom: 14px;
            }

            .logo-badge {
                width: 38px;
                height: 38px;
            }

            .logo-brand-title {
                font-size: 19px;
            }

            .logo-brand-subtitle {
                font-size: 6px;
                letter-spacing: 0;
            }

            .error-illustration {
                gap: 8px;
                margin-bottom: 10px;
            }

            .error-number {
                font-size: 72px;
                letter-spacing: -5px;
            }

            .error-mask {
                width: 62px;
                height: 62px;
                border-radius: 18px;
            }

            .error-mask svg {
                width: 33px;
                height: 33px;
            }

            .error-eyebrow {
                font-size: 9px;
                letter-spacing: 1.2px;
            }

            .error-heading {
                margin-bottom: 8px;
                font-size: 27px;
            }

            .error-description {
                margin-bottom: 15px;
                font-size: 12px;
                line-height: 1.65;
            }

            .error-actions {
                gap: 8px;
            }

            .error-btn {
                min-height: 41px;
                gap: 6px;
                padding: 9px 11px;
                font-size: 11px;
            }

            .error-btn svg {
                width: 15px;
                height: 15px;
            }

            .error-footer {
                gap: 7px;
                margin-top: 15px;
                padding-top: 12px;
                font-size: 9px;
            }

            .floating-icon {
                width: 38px;
                height: 38px;
                border-radius: 12px;
                opacity: .4;
            }

            .floating-icon svg {
                width: 19px;
                height: 19px;
            }
        }

        @media (max-height: 650px) {
            .error-page {
                padding-top: 62px;
                padding-bottom: 10px;
            }

            .error-card {
                padding-top: 16px;
                padding-bottom: 14px;
            }

            .meatcraft-logo {
                height: 45px;
                margin-bottom: 10px;
            }

            .logo-badge {
                width: 40px;
                height: 40px;
            }

            .error-illustration {
                margin-bottom: 8px;
            }

            .error-number {
                font-size: 68px;
            }

            .error-mask {
                width: 60px;
                height: 60px;
            }

            .error-mask svg {
                width: 32px;
                height: 32px;
            }

            .error-eyebrow {
                margin-bottom: 5px;
            }

            .error-heading {
                margin-bottom: 6px;
                font-size: 27px;
            }

            .error-description {
                margin-bottom: 13px;
                line-height: 1.55;
            }

            .error-footer {
                margin-top: 13px;
                padding-top: 10px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body>

    <div class="theater-background" aria-hidden="true">
        <div class="ambient-glow glow-one"></div>
        <div class="ambient-glow glow-two"></div>
        <div class="stage-light stage-light-left"></div>
        <div class="stage-light stage-light-right"></div>
        <div class="stage-curtain curtain-left"></div>
        <div class="stage-curtain curtain-right"></div>
        <div class="theater-orbit orbit-one"></div>
        <div class="theater-orbit orbit-two"></div>

        <div class="floating-icon mask-one"><i data-lucide="drama"></i></div>
        <div class="floating-icon mask-two"><i data-lucide="clapperboard"></i></div>
        <div class="floating-icon mask-three"><i data-lucide="sparkles"></i></div>

        <i class="floating-star star-one" data-lucide="star"></i>
        <i class="floating-star star-two" data-lucide="sparkle"></i>
        <i class="floating-star star-three" data-lucide="star"></i>
        <i class="floating-star star-four" data-lucide="sparkles"></i>

        <div class="stage-floor"></div>
    </div>

    <div class="utility-controls">
        <button class="header-icon-btn" id="directionToggle" type="button"
            aria-label="Toggle RTL and LTR" title="Toggle RTL / LTR">
            <i data-lucide="arrow-left-right"></i>
        </button>

        <button class="header-icon-btn" id="themeToggle" type="button"
            aria-label="Toggle light and dark mode" title="Toggle Light / Dark Mode">
            <i data-lucide="moon"></i>
        </button>
    </div>

    <main class="error-page">
        <section class="error-card" aria-labelledby="errorTitle">

            <a href="index.html" class="meatcraft-logo" aria-label="StageSprouts Home">
                <div class="logo-badge">
                    <img src="logo.png" alt="StageSprouts Theater Logo" class="brand-logo-img">
                </div>

                <div class="logo-text-group">
                    <span class="logo-brand-title">Stage<span class="brand-craft">Sprouts</span></span>
                    <span class="logo-brand-subtitle">KIDS THEATER &amp; DRAMA WORKSHOP</span>
                </div>
            </a>

            <div class="error-illustration" aria-hidden="true">
                <span class="error-number">4</span>
                <div class="error-mask"><i data-lucide="drama"></i></div>
                <span class="error-number">4</span>
                <span class="illustration-star illustration-star-one">✦</span>
                <span class="illustration-star illustration-star-two">✧</span>
            </div>

            <span class="error-eyebrow">
                <i data-lucide="sparkles"></i>
                <span>Oops! Wrong Stage</span>
            </span>

            <h1 class="error-heading" id="errorTitle">Page Not Found</h1>

            <p class="error-description">
                Looks like this scene isn't in our script.
                Let's get you back to the magic of the stage!
            </p>

            <div class="error-actions">
                <a href="index.html" class="error-btn error-btn-primary">
                    <i data-lucide="house"></i>
                    <span>Back to Home</span>
                </a>

                <button class="error-btn error-btn-outline" id="goBackButton" type="button">
                    <i data-lucide="arrow-left"></i>
                    <span>Go Back</span>
                </button>
            </div>

            <div class="error-footer">
                <span class="footer-star">✦</span>
                <span>Every great story finds its way.</span>
                <span class="footer-star">✦</span>
            </div>

        </section>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const body = document.body;
            const html = document.documentElement;
            const themeToggle = document.getElementById("themeToggle");
            const directionToggle = document.getElementById("directionToggle");
            const goBackButton = document.getElementById("goBackButton");

            function renderIcons() {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }

            function applyTheme(theme, save = true) {
                body.classList.toggle("dark-mode", theme === "dark");

                themeToggle.innerHTML =
                    `<i data-lucide="${theme === "dark" ? "sun" : "moon"}"></i>`;

                themeToggle.setAttribute(
                    "aria-label",
                    theme === "dark" ? "Switch to light mode" : "Switch to dark mode"
                );

                themeToggle.title =
                    theme === "dark" ? "Switch to Light Mode" : "Switch to Dark Mode";

                if (save) {
                    localStorage.setItem("stagesprouts-theme", theme);
                }

                renderIcons();
            }

            function applyDirection(direction, save = true) {
                html.setAttribute("dir", direction);

                directionToggle.setAttribute(
                    "aria-label",
                    `Switch to ${direction === "ltr" ? "RTL" : "LTR"} direction`
                );

                if (save) {
                    localStorage.setItem("stagesprouts-direction", direction);
                }
            }

            applyTheme(localStorage.getItem("stagesprouts-theme") || "light", false);
            applyDirection(localStorage.getItem("stagesprouts-direction") || "ltr", false);
            renderIcons();

            themeToggle.addEventListener("click", () => {
                const nextTheme = body.classList.contains("dark-mode") ? "light" : "dark";
                applyTheme(nextTheme);
            });

            directionToggle.addEventListener("click", () => {
                const nextDirection = html.getAttribute("dir") === "rtl" ? "ltr" : "rtl";
                applyDirection(nextDirection);
            });

            goBackButton.addEventListener("click", () => {
                if (window.history.length > 1 && document.referrer) {
                    window.history.back();
                } else {
                    window.location.href = "index.html";
                }
            });
        });
    </script>
</body>
</html>
